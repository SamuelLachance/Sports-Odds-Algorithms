name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full World Cup + prediction cache rebuild (slow)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # Daily algo odds rebuild at 3:00 America/Toronto (EDT = 07:00 UTC; EST = 08:00 UTC)
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WC_MC_ITERATIONS: "25"
      FAST_DAILY_BUILD: ${{ (github.event_name == 'schedule' || github.event.inputs.full_build != 'true') && '1' || '' }}
      FULL_BUILD: ${{ github.event.inputs.full_build == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: python scripts/build_gh_pages.py

      - name: Persist tracking store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking.json
          if git diff --staged --quiet; then
            echo "Tracking store unchanged."
          else
            git commit -m "Update bet tracking store after daily sync. [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
