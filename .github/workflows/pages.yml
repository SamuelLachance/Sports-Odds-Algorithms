name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "tests/**"
      - "**/*.md"
      - ".cursor/**"
      # Bot tracking sync must not enqueue a second Pages deploy mid-flight.
      - "data/tracking.json"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full precomputed prediction cache rebuild (slow)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # America/Toronto (EDT, UTC-4): midnight, 6am, noon, 6pm local — 4 deploys/day.
  # EST (UTC-5) shifts each run 1 hour later locally.
  schedule:
    - cron: "0 4 * * *"   # 00:00 Toronto EDT
    - cron: "0 10 * * *"  # 06:00 Toronto EDT
    - cron: "0 16 * * *"  # 12:00 Toronto EDT
    - cron: "0 22 * * *"  # 18:00 Toronto EDT

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deploy at a time. Do not cancel in-flight deploys — aborting
# during syncing_files causes "Deployment failed, try again later."
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip actions]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fast path unless an operator explicitly requests a full rebuild.
      FAST_DAILY_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' && '' || '1' }}
      FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'true' && '1' || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore sports DB cache
        uses: actions/cache@v4
        with:
          path: .build-cache/sports-db
          key: sports-db-${{ hashFiles('web/sports_db/**', 'web/live_data.py', 'web/espn_client.py', 'data/ratings/**', 'data/soccer_meta_weights.json', 'data/sports_meta_weights.json') }}-${{ runner.os }}
          restore-keys: |
            sports-db-${{ hashFiles('web/sports_db/**', 'web/live_data.py', 'web/espn_client.py', 'data/ratings/**', 'data/soccer_meta_weights.json', 'data/sports_meta_weights.json') }}-
            sports-db-

      - name: Restore Pages API cache
        uses: actions/cache@v4
        with:
          path: .build-cache/pages-api
          key: pages-api-${{ hashFiles('web/sports_db/**', 'web/daily_service.py', 'web/tracking_service.py', 'web/predict_service.py', 'data/ratings/**') }}-${{ runner.os }}
          restore-keys: |
            pages-api-${{ hashFiles('web/sports_db/**', 'web/daily_service.py', 'web/tracking_service.py', 'web/predict_service.py', 'data/ratings/**') }}-
            pages-api-

      - name: Compute cache date
        id: cache_date
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NHL v2 live cache (MoneyPuck daily slices)
        uses: actions/cache@v4
        with:
          path: .build-cache/nhl-v2-live
          key: nhl-v2-live-${{ steps.cache_date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            nhl-v2-live-${{ steps.cache_date.outputs.today }}-
            nhl-v2-live-

      - name: Restore soccer v2 live cache (football-data current-season CSVs)
        uses: actions/cache@v4
        with:
          path: .build-cache/soccer-v2-live
          key: soccer-v2-live-${{ steps.cache_date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            soccer-v2-live-${{ steps.cache_date.outputs.today }}-
            soccer-v2-live-

      - name: Restore WNBA v2 live cache (ESPN current-season events + boxes)
        uses: actions/cache@v4
        with:
          path: .build-cache/wnba-v2-live
          key: wnba-v2-live-${{ steps.cache_date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            wnba-v2-live-${{ steps.cache_date.outputs.today }}-
            wnba-v2-live-

      - name: Build static site
        run: python scripts/build_gh_pages.py

      - name: Persist tracking store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking.json data/soccer_paper_tracking.json
          if git diff --staged --quiet; then
            echo "Tracking store unchanged."
            exit 0
          fi
          git commit -m "Update bet tracking store after daily sync. [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "ERROR: Could not push tracking store after 5 attempts."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - id: deployment_retry_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        run: sleep 120

      - id: deployment_retry_3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify deploy succeeded
        if: >-
          steps.deployment.outcome != 'success' &&
          steps.deployment_retry_2.outcome != 'success' &&
          steps.deployment_retry_3.outcome != 'success'
        run: |
          echo "GitHub Pages deploy failed after 3 attempts."
          exit 1
