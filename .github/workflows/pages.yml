name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "tests/**"
      - "**/*.md"
      - ".cursor/**"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full precomputed prediction cache rebuild (slow)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  # America/Toronto (EDT, UTC-4): midnight, 6am, noon, 6pm local — 4 deploys/day.
  # EST (UTC-5) shifts each run 1 hour later locally.
  schedule:
    - cron: "0 4 * * *"   # 00:00 Toronto EDT
    - cron: "0 10 * * *"  # 06:00 Toronto EDT
    - cron: "0 16 * * *"  # 12:00 Toronto EDT
    - cron: "0 22 * * *"  # 18:00 Toronto EDT

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAST_DAILY_BUILD: ${{ (github.event_name == 'schedule' || github.event.inputs.full_build != 'true') && '1' || '' }}
      FULL_BUILD: ${{ github.event.inputs.full_build == 'true' && '1' || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Restore sports DB cache
        uses: actions/cache@v4
        with:
          path: .build-cache/sports-db
          key: sports-db-${{ hashFiles('web/sports_db/**', 'web/live_data.py', 'web/espn_client.py', 'data/ratings/**', 'data/soccer_meta_weights.json', 'data/sports_meta_weights.json') }}-${{ runner.os }}
          restore-keys: |
            sports-db-${{ hashFiles('web/sports_db/**', 'web/live_data.py', 'web/espn_client.py', 'data/ratings/**', 'data/soccer_meta_weights.json', 'data/sports_meta_weights.json') }}-
            sports-db-

      - name: Build static site
        run: python scripts/build_gh_pages.py

      - name: Persist tracking store
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking.json
          if git diff --staged --quiet; then
            echo "Tracking store unchanged."
            exit 0
          fi
          git commit -m "Update bet tracking store after daily sync. [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "WARNING: Could not push tracking store; deploy will still use built tracking.json."
          exit 0

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
