name: Refresh predictions

# Rebuilds the pre-game projections + database 6x/day and deploys them. Commits
# pushed by the CI token do not trigger other workflows, so this job deploys to
# Pages itself rather than relying on pages.yml. Live in-game scores update
# separately, client-side, straight from the MLB Stats API.

on:
  schedule:
    # every 4 hours = 6 runs/day (UTC), catching probable-pitcher announcements
    # and overnight standings updates.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: board-deploy      # shared with the value-edges job so Pages deploys serialize
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed data back to the repo
  pages: write      # deploy
  id-token: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # nhl_serve.py needs numpy. Without it refresh.py skipped the NHL
      # re-serve every cycle and nhl.json only moved on Mondays - a week of lag
      # on results, standings and ratings once the season is under way.
      - name: Install numpy for the NHL serve
        run: pip install numpy

      - name: Rebuild board + database
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # server-side only; EV edge layer
        run: python refresh.py

      - name: Commit refreshed data (keeps the repo's fallback current)
        run: |
          git config user.name "glassbox-bot"
          git config user.email "glassbox-bot@users.noreply.github.com"
          # The lines cache is the persistent incremental state (per-game
          # pitching+batting box lines): committing it back means each run fetches
          # only newly-final box scores, never the whole season. The opening-odds
          # cache freezes each game's opening consensus. board/db/index deploy.
          git add site/data/board.json site/data/db.json site/index.html \
                  data/season_2026_lines.json data/opening_odds_2026.json \
                  data/mlb_pred_ledger.json
          # NHL incremental state from phase0/nhl_update.py plus the re-served
          # payload. The serve runs here every 4h (numpy installed above); the
          # pre-game freeze ledger must be committed with it, or the next run
          # would grade played games against replays instead of the numbers
          # published before puck drop.
          #
          # add-only-existing: the lineup archive appears only on NHL game days,
          # and upcoming is absent before the first in-season run.
          for f in data/nhl_lineup_archive.jsonl data/nhl_games.csv                    data/nhl_upcoming.json site/data/nhl.json                    data/nhl_hp_ledger.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # NFL finals attached by phase0/nfl_results_attach.py (scores,
          # standings, tier receipts; never a pre-game number) and the games
          # spine it fetched. Without these the NFL side froze between the
          # manual model runs. The pre-game ledger is read-only here (CI never
          # writes it; it is only re-synced from origin below, never edited).
          for f in site/data/nfl.json data/nfl_games.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "Refresh projections"
            # NFL: a local serve (payload + pre-game ledger, one commit) may have
            # reached origin while this run was working. -X theirs below would
            # silently revert its single-line nfl.json to this run's older copy
            # while its ledger stays, and the next attach would grade the older
            # number with the newer receipt. Instead, take origin's payload and
            # ledger and re-attach this cycle's finals on top of them.
            git fetch --quiet origin master || true
            if git rev-parse --verify --quiet origin/master >/dev/null && \
               ! git diff --quiet HEAD~1 origin/master -- site/data/nfl.json data/nfl_ph_ledger.json; then
              echo "origin carries a newer NFL payload/ledger: re-attaching finals on top of it"
              git checkout origin/master -- site/data/nfl.json data/nfl_ph_ledger.json
              python phase0/nfl_results_attach.py --no-fetch || \
                echo "::error title=NFL results attach::re-attach on origin's NFL serve failed; origin's payload is kept unmodified"
              git add site/data/nfl.json data/nfl_ph_ledger.json
              git commit --amend --no-edit
            fi
            # -X theirs: on a data-file conflict keep THIS run's full rebuild
            # (rebase replays our commit onto remote; "theirs" = our commit)
            git pull --rebase -X theirs --autostash origin master || true
            git push || echo "push skipped (race); Pages still deploys below, next run recommits"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
