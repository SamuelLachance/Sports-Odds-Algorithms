name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Core pytest suite
        run: >
          python -m pytest
          tests/test_hubacek_picks.py
          tests/test_tracking.py
          tests/test_clv_service.py
          tests/test_context_signals.py
          tests/test_portfolio_sizing.py
          tests/test_live_odds_enrichment.py
          tests/test_pick_strategy.py
          tests/test_bet_advisor.py
          tests/test_official_picks_hubacek.py
          tests/test_cbb_pred_model.py
          -q --tb=short

      - name: Smoke test
        run: python smoke_test.py
