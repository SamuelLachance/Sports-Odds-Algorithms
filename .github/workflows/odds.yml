name: Refresh value edges

# Near-live update of the >=20%-EV value badges: pulls current odds, recomputes the
# edge vs each game's frozen opening consensus, and redeploys the site. Does NOT
# rebuild the model (cheap: one odds request + a static rebuild). ~every 20 min
# (GitHub may delay short crons) = ~1 API request/run, well within the 20k budget.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: board-deploy      # shared with the full refresh so deploys don't collide
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  edges:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update value edges from live odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python refresh_odds.py

      - name: Commit board + opening-odds cache + edge ledger
        run: |
          git config user.name "glassbox-bot"
          git config user.email "glassbox-bot@users.noreply.github.com"
          # opening caches appear only once books post lines for that sport's
          # window (NFL cache is absent all offseason) — add what exists.
          # data/edge_ledger.json is the durable live-CLV evidence stream: it must
          # survive every cycle or the promotion gate stops accruing.
          # data/mlb_pred_ledger.json rides along for the same reason: this job
          # archives each pick's freshest pre-game consensus price into it (units
          # settlement), and an uncommitted price is a settlement that never happens.
          for f in site/data/board.json site/data/nfl.json site/data/nhl.json site/index.html \
                   data/opening_odds_2026.json data/nfl_opening_odds_2026.json \
                   data/nhl_opening_odds_2026.json data/edge_ledger.json \
                   data/mlb_pred_ledger.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no edge change"
          else
            git commit -m "Refresh value edges"
            # data/edge_ledger.json is ORDER-SENSITIVE state on an ephemeral runner:
            # board/opening caches regenerate idempotently, ledger rows do not. A
            # swallowed push failure discards this cycle's records permanently —
            # record_open needs a strictly-pre-game sighting, so unlike a touch or a
            # grade it cannot self-heal next cycle, and the loss lands hardest on rows
            # recorded closest to start (the shortest CLV windows). Retry the race,
            # then FAIL the job loudly rather than lose the evidence silently.
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "push rejected (race with a concurrent writer); rebasing and retrying"
              git pull --rebase -X ours --autostash origin master
            done
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
