<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151a28">
  <title>Sharp Odds — Algo Sports Betting Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="page-bg"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">SOA</span>
        <span class="brand-text">Sharp Odds</span>
      </a>
      <nav class="nav" id="mainNav" aria-label="Main navigation">
        <a href="#/" data-route="/">Home</a>
        <a href="#/games" data-route="/games">Games</a>
        <a href="#/teams" data-route="/teams">Leagues</a>
        <a href="#/picks" data-route="/picks">Algo Picks</a>
        <a href="#/tracking" data-route="/tracking">Tracking</a>
      </nav>
      <div class="header-actions">
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">☰</button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </div>
  </header>

  <div class="layout container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-block">
        <h4>Menu</h4>
        <ul class="sidebar-nav" id="sidebarNav"></ul>
      </div>
      <div class="sidebar-block">
        <h4>Today's slate</h4>
        <ul class="league-menu" id="leagueMenu"></ul>
      </div>
      <div class="sidebar-block">
        <h4>Leagues &amp; teams</h4>
        <div class="league-browse" id="leagueBrowse"></div>
      </div>
      <div class="sidebar-block" id="sidebarTeams" hidden>
        <h4 id="sidebarTeamsTitle">Teams</h4>
        <ul class="team-menu" id="teamMenu"></ul>
      </div>
      <div class="sidebar-block" id="sidebarGames" hidden>
        <h4 id="sidebarGamesTitle">Games</h4>
        <ul class="game-menu" id="gameMenu"></ul>
      </div>
    </aside>

    <main class="main-content" id="appRoot">
      <div class="panel empty-panel">Loading platform data…</div>
    </main>
  </div>

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Quick navigation">
    <a href="#/" data-route="/"><span class="nav-icon" aria-hidden="true">⌂</span>Home</a>
    <a href="#/games" data-route="/games"><span class="nav-icon" aria-hidden="true">◫</span>Games</a>
    <a href="#/picks" data-route="/picks"><span class="nav-icon" aria-hidden="true">★</span>Picks</a>
    <a href="#/teams" data-route="/teams"><span class="nav-icon" aria-hidden="true">◉</span>Leagues</a>
    <a href="#/tracking" data-route="/tracking"><span class="nav-icon" aria-hidden="true">◎</span>Track</a>
  </nav>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Sharp Odds · Sports Odds Algorithms V2</span>
      <span id="footerUpdated">—</span>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
