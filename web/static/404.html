<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sharp Odds — Redirecting</title>
  <script>
    (function () {
      // Project Pages live under /Sports-Odds-Algorithms; custom domain + local are root.
      var host = location.hostname || "";
      var projectBase = "/Sports-Odds-Algorithms";
      var base = /\.github\.io$/i.test(host) ? projectBase : "";
      var path = location.pathname || "/";
      if (base && path.indexOf(base) === 0) {
        path = path.slice(base.length) || "/";
      }
      if (!path.startsWith("/")) path = "/" + path;
      // Drop trailing slash except root; map filesystem 404s into hash routes.
      if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
      var hash = path === "/" ? "#/" : "#" + path;
      var prefix = base || "";
      location.replace(prefix + "/" + hash + location.search);
    })();
  </script>
</head>
<body>
  <p>Page not found. <a id="home-link" href="/#/">Return home</a>.</p>
  <script>
    (function () {
      var host = location.hostname || "";
      var base = /\.github\.io$/i.test(host) ? "/Sports-Odds-Algorithms" : "";
      var link = document.getElementById("home-link");
      if (link) link.setAttribute("href", (base || "") + "/#/");
    })();
  </script>
</body>
</html>
